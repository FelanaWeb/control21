<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Редактирование категории доходов</title>
  <link rel="stylesheet" href="../styles/bootstrap.min.css">
  <link rel="stylesheet" href="../styles/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</head>

<body style="height: 100vh;">

  <div class="dashboard d-flex h-100">

    <!-- Боковая панель -->
    <div class="d-flex flex-column flex-shrink-0 border-end">
      <!-- Логотип -->
      <div class="ps-3 pe-4 pt-4 pb-3">
        <a href="#" class="d-block text-center">
          <img class="" src="../images/logo.svg" alt="Логотип">
        </a>
      </div>
      <hr>
      <!-- Меню -->

      <div class="btn-group flex-column mb-auto p-4" role="group" aria-label="Basic radio toggle button group">
        <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" >
        <label class="d-flex align-items-center gap-2 btn btn-outline-primary text-start border-0 rounded roboto14"
          for="btnradio1">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house"
            viewBox="0 0 16 16">
            <path
              d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
          </svg>
          Главная
        </label>

        <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
        <label class="d-flex align-items-center gap-2 btn btn-outline-primary text-start border-0 rounded roboto14"
          for="btnradio2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cash-coin"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8m5-4a5 5 0 1 1-10 0 5 5 0 0 1 10 0" />
            <path
              d="M9.438 11.944c.047.596.518 1.06 1.363 1.116v.44h.375v-.443c.875-.061 1.386-.529 1.386-1.207 0-.618-.39-.936-1.09-1.1l-.296-.07v-1.2c.376.043.614.248.671.532h.658c-.047-.575-.54-1.024-1.329-1.073V8.5h-.375v.45c-.747.073-1.255.522-1.255 1.158 0 .562.378.92 1.007 1.066l.248.061v1.272c-.384-.058-.639-.27-.696-.563h-.668zm1.36-1.354c-.369-.085-.569-.26-.569-.522 0-.294.216-.514.572-.578v1.1zm.432.746c.449.104.655.272.655.569 0 .339-.257.571-.709.614v-1.195z" />
            <path
              d="M1 0a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4.083q.088-.517.258-1H3a2 2 0 0 0-2-2V3a2 2 0 0 0 2-2h10a2 2 0 0 0 2 2v3.528c.38.34.717.728 1 1.154V1a1 1 0 0 0-1-1z" />
            <path d="M9.998 5.083 10 5a2 2 0 1 0-3.132 1.65 6 6 0 0 1 3.13-1.567" />
          </svg>
          Доходы & Расходы
        </label>


        <input type="radio" class="btn-check" name="btnradio" id="btnradio3" autocomplete="off" checked>
        <label
          class="d-flex align-items-center justify-content-between gap-2 btn btn-outline-primary text-start border-0 rounded roboto14 "
          for="btnradio3" data-bs-toggle="collapse" data-bs-target="#home-collapse" aria-expanded="true">
          Категории
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-chevron-compact-right" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M6.776 1.553a.5.5 0 0 1 .671.223l3 6a.5.5 0 0 1 0 .448l-3 6a.5.5 0 1 1-.894-.448L9.44 8 6.553 2.224a.5.5 0 0 1 .223-.671" />
          </svg>
        </label>

        <div class="collapse show" data-bs-toggle="button" id="home-collapse">
          <ul class="list-unstyled border w-100">
            <li class="nav-item">
              <a href="#" class="w-100 link-dark d-inline-flex text-decoration-none rounded">
                <button class="w-100 btn btn-primary text-start border-0">
                  Доходы
                </button>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" class="w-100 link-dark d-inline-flex text-decoration-none rounded">
                <button class="w-100 btn btn-outline-primary text-start border-0">
                  Расходы
                </button>
              </a>
            </li>
          </ul>
        </div>

      </div>

      <!-- Баланс -->
      <div class="dashboard-balance ps-3">
        Баланс: <span>500$</span>
      </div>
      <hr>
      <!-- Пользователь -->
      <div class="p-3">
        <a href="#" class="pb-4 d-flex align-items-center text-decoration-none dashboard-user">
          <svg width="36" height="36" class="rounded-circle me-2" viewBox="0 0 36 36" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="18" fill="#D9D9D9" />
            <path
              d="M18 18C19.0609 18 20.0783 17.5786 20.8284 16.8284C21.5786 16.0783 22 15.0609 22 14C22 12.9391 21.5786 11.9217 20.8284 11.1716C20.0783 10.4214 19.0609 10 18 10C16.9391 10 15.9217 10.4214 15.1716 11.1716C14.4214 11.9217 14 12.9391 14 14C14 15.0609 14.4214 16.0783 15.1716 16.8284C15.9217 17.5786 16.9391 18 18 18ZM20.6667 14C20.6667 14.7072 20.3857 15.3855 19.8856 15.8856C19.3855 16.3857 18.7072 16.6667 18 16.6667C17.2928 16.6667 16.6145 16.3857 16.1144 15.8856C15.6143 15.3855 15.3333 14.7072 15.3333 14C15.3333 13.2928 15.6143 12.6145 16.1144 12.1144C16.6145 11.6143 17.2928 11.3333 18 11.3333C18.7072 11.3333 19.3855 11.6143 19.8856 12.1144C20.3857 12.6145 20.6667 13.2928 20.6667 14ZM26 24.6667C26 26 24.6667 26 24.6667 26H11.3333C11.3333 26 10 26 10 24.6667C10 23.3333 11.3333 19.3333 18 19.3333C24.6667 19.3333 26 23.3333 26 24.6667ZM24.6667 24.6613C24.6653 24.3333 24.4613 23.3467 23.5573 22.4427C22.688 21.5733 21.052 20.6667 18 20.6667C14.9467 20.6667 13.312 21.5733 12.4427 22.4427C11.5387 23.3467 11.336 24.3333 11.3333 24.6613H24.6667Z"
              fill="#6C757D" />
          </svg>
          <div>Roman Chernov</div>
        </a>
      </div>
    </div>

    <!-- Редактирование категории доходов -->
    <div class="w-100 pt-1 pb-5">
      <div class="ms-5 mt-3 ps-3 pt-5 pe-5 pb-4">
        <div class="header-title mt-3 pt-3 pb-5 fs-1">Редактирование категории доходов</div>
        <main class="d-flex flex-column gap-3">
          <div class="input-group mb-2 w-25">
            <input value="Зарплата" type="text" class="form-control w-25 income-placeholder" placeholder="Название..." aria-label="name" aria-describedby="basic-addon1">
          </div>
          <div>
            <button type="button" class="btn btn-success me-2 font-little w-auto">Сохранить</button>
            <button type="button" class="btn btn-danger font-little">Отмена</button>
          </div>
          
        </main>
      </div>
    </div>
  </div>


</body>

</html>
